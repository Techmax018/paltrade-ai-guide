services:
  - type: web
    name: paltrade-backend
    runtime: node
    region: oregon                # Closest to most Vantage/Deriv endpoints
    plan: starter                 # Upgrade to standard for production
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # All secrets set manually in Render dashboard — never in this file
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard: postgresql://paltradebackend_user:...@dpg-d9ouv9vqj5pc738dos6g-a.ohio-postgres.render.com/paltradebackend
      - key: JWT_SECRET
        sync: false
      - key: METAAPI_TOKEN
        sync: false  # Set in Render dashboard — your MetaApi JWT token
      - key: ENCRYPTION_KEY
        sync: false
      - key: PALTRADE_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://paltrade-ai-guide.vercel.app
